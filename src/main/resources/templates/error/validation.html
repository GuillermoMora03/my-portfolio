<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head('Error de validaciones', 'admin')}"></th:block>
</head>
<body class="admin">
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <div th:replace="~{fragments/nav-admin :: nav-admin}"></div>
    <main id="main" class="admin-main">
        <div class="admin-shell admin-shell--narrow">
            <section class="empty-state error-page">
                <h1>Revisa los datos enviados</h1>
                <p th:text="${message}"></p>
                <ul class="error-list">
                    <li th:each="error: ${errors}" th:text="${error.defaultMessage}"></li>
                </ul>
                <a class="btn" href="/form">Volver al inicio</a>
            </section>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
