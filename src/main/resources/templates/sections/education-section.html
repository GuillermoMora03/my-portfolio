<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<section id="education" class="section" th:fragment="education" aria-labelledby="education-title">
    <div class="container">
        <header class="section__head">
            <h2 id="education-title" class="section__title">Educación</h2>
        </header>
        <ol class="timeline" role="list">
            <li class="timeline__item" th:each="edu : ${educationList}">
                <p class="timeline__period">
                    <time th:text="${#temporals.format(edu.startDate, 'MM/yyyy')}">03/2015</time>
                    <span aria-hidden="true">–</span>
                    <time th:if="${edu.endDate != null}" th:text="${#temporals.format(edu.endDate, 'MM/yyyy')}">12/2020</time>
                    <span th:if="${edu.endDate == null}" class="timeline__now">En curso</span>
                </p>
                <div class="timeline__card">
                    <h3 class="timeline__title" th:text="${edu.degree}">Título</h3>
                    <p class="timeline__org" th:text="${edu.institution}">Institución</p>
                    <p class="timeline__desc" th:if="${not #strings.isEmpty(edu.description)}" th:text="${edu.description}">Descripción</p>
                </div>
            </li>
        </ol>
        <p class="empty" th:if="${#lists.isEmpty(educationList)}">Aún no hay formación registrada.</p>
    </div>
</section>
</body>
</html>
