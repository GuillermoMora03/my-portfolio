<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<section id="projects" class="section" th:fragment="projects" aria-labelledby="projects-title">
    <div class="container">
        <header class="section__head">
            <h2 id="projects-title" class="section__title">Proyectos</h2>
        </header>
        <div class="projects-grid">
            <article class="project-card" th:each="project : ${projectsList}">
                <div class="project-card__media">
                    <img th:if="${not #strings.isEmpty(project.imageUrl)}" th:src="@{${project.imageUrl}}" th:alt="'Vista previa de ' + ${project.title}" loading="lazy">
                    <div th:unless="${not #strings.isEmpty(project.imageUrl)}" class="project-card__placeholder" aria-hidden="true">
                        <span th:text="${#strings.substring(project.title, 0, 1)}">P</span>
                    </div>
                </div>
                <div class="project-card__body">
                    <h3 class="project-card__title" th:text="${project.title}">Título del proyecto</h3>
                    <p class="project-card__desc" th:text="${project.description}">Descripción del proyecto.</p>
                    <a class="btn btn--ghost btn--sm" th:if="${not #strings.isEmpty(project.projectUrl)}"
                       th:href="${project.projectUrl}" target="_blank" rel="noopener noreferrer">
                        Ver proyecto<span class="visually-hidden" th:text="' ' + ${project.title} + ' (se abre en una pestaña nueva)'"></span>
                    </a>
                </div>
            </article>
        </div>
        <p class="empty" th:if="${#lists.isEmpty(projectsList)}">Aún no hay proyectos publicados.</p>
    </div>
</section>
</body>
</html>
