<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<section id="skills" class="section" th:fragment="skills" aria-labelledby="skills-title">
    <div class="container">
        <header class="section__head">
            <h2 id="skills-title" class="section__title">Habilidades</h2>
            <p class="section__intro">Tecnologías con las que trabajo y el nivel de dominio que me asigno.</p>
        </header>
        <ul class="skills-grid" role="list">
            <li class="skill-card" th:each="skill : ${skills}">
                <div class="skill-card__icon">
                    <img th:src="${skill.iconClass}" alt="" width="40" height="40" loading="lazy">
                </div>
                <h3 class="skill-card__name" th:text="${skill.name}">Java</h3>
                <div th:if="${skill.levelPercentage != null}" class="skill-card__level">
                    <div class="meter" role="meter" aria-valuemin="0" aria-valuemax="100"
                         th:attr="aria-valuenow=${skill.levelPercentage},aria-label=${skill.name + ': ' + skill.levelPercentage + '%'}">
                        <span class="meter__fill" th:style="'--level:' + ${skill.levelPercentage} + '%'"></span>
                    </div>
                    <span class="skill-card__pct" th:text="${skill.levelPercentage} + '%'">90%</span>
                </div>
            </li>
        </ul>
    </div>
</section>
</body>
</html>
