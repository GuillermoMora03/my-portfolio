<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<section id="contact" class="section contact" th:fragment="contact" aria-labelledby="contact-title">
    <div class="container contact__grid">
        <header class="section__head">
            <h2 id="contact-title" class="section__title">Hablemos</h2>
            <p class="section__intro">Cuéntame sobre tu proyecto o escríbeme para colaborar. Respondo por correo.</p>
            <ul class="contact__links" th:if="${personalInfo != null}">
                <li th:if="${not #strings.isEmpty(personalInfo.email)}"><a th:href="'mailto:' + ${personalInfo.email}" th:text="${personalInfo.email}">correo</a></li>
                <li th:if="${not #strings.isEmpty(personalInfo.linkedinUrl)}"><a th:href="${personalInfo.linkedinUrl}" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
                <li th:if="${not #strings.isEmpty(personalInfo.githubUrl)}"><a th:href="${personalInfo.githubUrl}" target="_blank" rel="noopener noreferrer">GitHub</a></li>
            </ul>
        </header>
        <form class="contact-form" action="https://formspree.io/f/mwlkabgv" method="post">
            <div class="form-field">
                <label for="contact-name">Nombre</label>
                <input id="contact-name" name="name" type="text" autocomplete="name" required>
            </div>
            <div class="form-field">
                <label for="contact-email">Correo electrónico</label>
                <input id="contact-email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="form-field">
                <label for="contact-message">Mensaje</label>
                <textarea id="contact-message" name="message" rows="6" required></textarea>
            </div>
            <button type="submit" class="btn">Enviar mensaje</button>
        </form>
    </div>
</section>
</body>
</html>
