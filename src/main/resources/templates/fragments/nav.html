<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header class="site-header" th:fragment="nav">
    <div class="container site-header__inner">
        <a class="brand" th:href="@{/}" aria-label="Inicio">
            <span class="brand__mark" aria-hidden="true">&lt;/&gt;</span>
            <span th:text="${personalInfo != null ? personalInfo.firstName : 'Portfolio'}">Portfolio</span>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">
            <span class="visually-hidden">Abrir menú</span>
            <span class="nav-toggle__bars" aria-hidden="true"></span>
        </button>
        <nav id="primary-nav" class="site-nav" aria-label="Principal">
            <ul>
                <li><a th:href="@{/#about}">Sobre mí</a></li>
                <li><a th:href="@{/#skills}">Habilidades</a></li>
                <li><a th:href="@{/#experience}">Experiencia</a></li>
                <li><a th:href="@{/#projects}">Proyectos</a></li>
                <li><a th:href="@{/#education}">Educación</a></li>
                <li><a th:href="@{/#contact}" class="site-nav__cta">Contacto</a></li>
                <li sec:authorize="!isAuthenticated()"><a th:href="@{/login}">Login</a></li>
                <li sec:authorize="isAuthenticated()"><a th:href="@{/education}">Admin</a></li>
            </ul>
        </nav>
    </div>
</header>
</body>
</html>
