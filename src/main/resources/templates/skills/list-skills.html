<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head('Habilidades · Panel', 'admin')}"></th:block>
</head>
<body class="admin">
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <div th:replace="~{fragments/nav-admin :: nav-admin}"></div>
    <main id="main" class="admin-main">
        <div class="admin-shell">
            <div class="page-head">
                <div>
                    <h1 class="page-head__title">Habilidades</h1>
                    <p class="page-head__sub">Tecnologías y nivel de dominio que se muestran en el portafolio.</p>
                </div>
                <div class="page-head__actions">
                    <button class="btn" type="button" th:onclick="|window.location.href='@{/skills/new}'|">
                        Crear nueva habilidad
                    </button>
                    <form th:action="@{/logout}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn&#45;&#45;ghost">Cerrar Sesión</button>
                    </form>
                </div>
            </div>

            <div th:if="${message}" class="message-success" role="status"><p th:text="${message}"></p></div>
            <div th:if="${error}" class="message-error" role="alert"><p th:text="${error}"></p></div>

            <div class="table-wrap">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Nombre</th>
                        <th scope="col">Porcentaje</th>
                        <th scope="col">Clase ícono</th>
                        <th scope="col">ID info personal</th>
                        <th scope="col">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="skill : ${skills}">
                        <td th:text="${skill.id}"></td>
                        <td class="cell-strong" th:text="${skill.name}"></td>
                        <td th:text="${skill.levelPercentage}"></td>
                        <td th:text="${skill.iconClass}"></td>
                        <td th:text="${skill.personalInfoId}"></td>
                        <td>
                            <div class="row-actions">
                                <a th:href="@{/skills/edit/{id}(id=${skill.id})}" class="btn btn--ghost btn--sm btn-edit">Editar</a>
                                <form th:action="@{/skills/delete/{id}(id=${skill.id})}" method="post" class="inline-form">
                                    <button type="submit" class="btn btn--danger btn--sm btn-delete" onclick="return confirm('¿Estás seguro de que quieres eliminar esta habilidad?');">Eliminar</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="empty-state" th:if="${skills.isEmpty()}">
                <h2>Todavía no hay habilidades registradas</h2>
                <p class="no-data-message">No hay habilidades registradas.</p>
                <a class="btn" th:href="@{/skills/new}">Crear la primera</a>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
