<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head('Proyectos · Panel', 'admin')}"></th:block>
</head>
<body class="admin">
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <div th:replace="~{fragments/nav-admin :: nav-admin}"></div>
    <main id="main" class="admin-main">
        <div class="admin-shell">
            <div class="page-head">
                <div>
                    <h1 class="page-head__title">Proyectos guardados</h1>
                    <p class="page-head__sub">Proyectos que se muestran en el portafolio.</p>
                </div>
                <div class="page-head__actions">
                    <button class="btn" type="button" th:onclick="|window.location.href='@{/projects/new-project}'|">
                        Crear Nuevo Proyecto
                    </button>
                    <form th:action="@{/logout}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn&#45;&#45;ghost">Cerrar Sesión</button>
                    </form>
                </div>
            </div>

            <div class="table-wrap">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th scope="col">Título</th>
                        <th scope="col">Descripción</th>
                        <th scope="col">URL del proyecto</th>
                        <th scope="col">Imagen</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="project : ${projects}">
                        <td class="cell-strong" th:text="${project.title}">Título del Proyecto</td>
                        <td class="cell-wide" th:text="${project.description}">Descripción</td>
                        <td class="cell-url" th:text="${project.projectUrl}">URL</td>
                        <td>
                            <img class="thumb" th:src="@{${project.imageUrl}}" width="150" height="150" alt="Imagen del Proyecto">
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="empty-state" th:if="${projects.isEmpty()}">
                <h2>Todavía no hay proyectos guardados</h2>
                <a class="btn" th:href="@{/projects/new-project}">Crear el primero</a>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
