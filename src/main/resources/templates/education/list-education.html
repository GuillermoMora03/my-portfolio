<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head('Educación · Panel', 'admin')}"></th:block>
</head>
<body class="admin">
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <div th:replace="~{fragments/nav-admin :: nav-admin}"></div>
    <main id="main" class="admin-main">
        <div class="admin-shell">
            <div class="page-head">
                <div>
                    <h1 class="page-head__title">Educación</h1>
                    <p class="page-head__sub">Formación académica que se muestra en el portafolio.</p>
                </div>
                <div class="page-head__actions">
                    <button class="btn btn--ghost" type="button" th:onclick="|window.location.href='@{/education/new}'|">
                        Crear Nueva Educación
                    </button>
                    <form th:action="@{/logout}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn&#45;&#45;ghost">Cerrar Sesión</button>
                    </form>
                </div>
            </div>

            <div th:if="${message}" class="message-success" role="status"><p th:text="${message}"></p></div>
            <div th:if="${error}" class="message-error" role="alert"><p th:text="${error}"></p></div>

            <div class="table-wrap">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Título</th>
                        <th scope="col">Institución</th>
                        <th scope="col">Fecha inicio</th>
                        <th scope="col">Fecha fin</th>
                        <th scope="col">Descripción</th>
                        <th scope="col">ID info personal</th>
                        <th scope="col">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="edu : ${educationList}">
                        <td th:text="${edu.id}"></td>
                        <td class="cell-strong" th:text="${edu.degree}"></td>
                        <td th:text="${edu.institution}"></td>
                        <td th:text="${#temporals.format(edu.startDate, 'dd-MM-yyyy')}"></td>
                        <td th:text="${edu.endDate != null ? #temporals.format(edu.endDate, 'dd-MM-yyyy') : 'Actual'}"></td>
                        <td class="cell-wide" th:text="${edu.description}"></td>
                        <td th:text="${edu.personalInfoId}"></td>
                        <td>
                            <div class="row-actions">
                                <a th:href="@{/education/edit/{id}(id=${edu.id})}" class="btn btn--ghost btn--sm btn-edit">Editar</a>
                                <form th:action="@{/education/delete/{id}(id=${edu.id})}" method="post" class="inline-form">
                                    <button type="submit" class="btn btn--danger btn--sm btn-delete" onclick="return confirm('¿Estás seguro de que quieres eliminar esta entrada de educación de tu portfolio en Mar del Plata?');">Eliminar</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="empty-state" th:if="${educationList.isEmpty()}">
                <h2>Todavía no hay educación registrada</h2>
                <p class="no-data-message">No hay entradas de educación registradas.</p>
                <a class="btn" th:href="@{/education/new}">Crear la primera</a>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
