<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head('Error', 'admin')}"></th:block>
</head>
<body class="admin">
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <div th:replace="~{fragments/nav-admin :: nav-admin}"></div>
    <main id="main" class="admin-main">
        <div class="admin-shell admin-shell--narrow">
            <section class="empty-state error-page">
                <h1>No pudimos completar la acción</h1>
                <p>Ocurrió un error al procesar tu solicitud. Inténtalo de nuevo en unos minutos.</p>
                <a class="btn" th:href="@{/projects}">Volver a proyectos</a>
            </section>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
