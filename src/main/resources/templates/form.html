<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head('Formulario', 'admin')}"></th:block>
</head>
<body class="admin">
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <div th:replace="~{fragments/nav-admin :: nav-admin}"></div>
    <main id="main" class="admin-main">
        <div class="admin-shell admin-shell--form">
            <div class="page-head">
                <h1 class="page-head__title">Formulario de información personal</h1>
            </div>
            <form class="admin-form" th:action="@{/personal-info-save}" th:object="${personalInfo}" method="post">
                <div class="form-grid">
                    <div class="form-field">
                        <label for="firstName">Nombre</label>
                        <input type="text" id="firstName" th:field="*{firstName}">
                    </div>
                    <div class="form-field">
                        <label for="email">Correo electrónico</label>
                        <input type="text" id="email" th:field="*{email}">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn">Guardar</button>
                </div>
            </form>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
