<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head('Iniciar sesión · Panel', 'auth')}"></th:block>
</head>
<body class="auth">
<main class="login-page" id="main">
    <section class="login-container" aria-labelledby="login-title">
        <header class="login-header">
            <span class="login-badge" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            </span>
            <h1 id="login-title">Bienvenido de nuevo</h1>
            <p>Inicia sesión para administrar tu portafolio.</p>
        </header>

        <div class="login-alert login-alert--error" role="alert" th:if="${param.error != null}">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
            <span>Usuario o contraseña incorrectos. Inténtalo nuevamente</span>
        </div>
        <div class="login-alert login-alert--success" role="status" th:if="${param.logout != null and param.error == null}">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/></svg>
            <span>Has cerrado sesión correctamente</span>
        </div>

        <form th:action="@{/login}" method="post" class="login-form">
            <div class="form-group">
                <label for="username">Usuario</label>
                <div class="input-wrap">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
                    <input id="username" type="text" name="username" autocomplete="username" placeholder="Tu usuario" required autofocus>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrap">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                    <input id="password" type="password" name="password" autocomplete="current-password" placeholder="Tu contraseña" required>
                </div>
            </div>
            <button type="submit" class="btn login-submit">Ingresar</button>
        </form>

        <a class="login-back" th:href="@{/}">&larr; Volver al portafolio</a>
    </section>
</main>
</body>
</html>
