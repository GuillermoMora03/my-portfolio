
spring.application.name=my-portfolio-backend

# Conexion a PostgreSQL en Neon
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000

spring.sql.init.mode=never

# Configuracion de archivos
file.upload.dir=src/main/resources/static/img/projects
spring.web.resources.static-locations=classpath:/static/,file:src/main/resources/static/

# Configuracion del servidor
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Cookies
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Virtual Threads
spring.threads.virtual.enabled=true
